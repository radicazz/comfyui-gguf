[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comfyui-gguf"
description = "GGUF Quantization support for native ComfyUI models"
version = "2.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "gguf>=0.13.0",
    "sentencepiece",
    "protobuf",
]

[project.urls]
Repository = "https://github.com/radicazz/comfyui-gguf"
"Upstream" = "https://github.com/city96/ComfyUI-GGUF"

[tool.uv]
managed = true

[tool.comfy]
PublisherId = "radicazz"
DisplayName = "ComfyUI-GGUF (AirPods Fork)"
Icon = ""
